# Runs inside the web container. The host nginx terminates TLS and proxies here.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m; # Excel uploads

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # File names contain a content hash, so they never change: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must be revalidated on every load, or browsers keep an old copy after a
  # deploy that points at asset files which no longer exist (blank page).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
